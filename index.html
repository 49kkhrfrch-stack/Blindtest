<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLINDTEST RAP FR</title>
<style>
:root{--bg:#07040d;--card:#150c24;--line:#2d1a4d;--tx:#f5eeff;--mu:#a493c4;--v:#a855f7;--r:#ff2d55;--n:#22f0ff;--ok:#2dff8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 0,#2a0b4d 0,transparent 45%),radial-gradient(circle at 90% 100%,#4d0b1e 0,transparent 40%),var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
.s{display:none;min-height:100%;padding:18px;max-width:520px;margin:0 auto;flex-direction:column;gap:14px;animation:in .35s}
.s.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{font-weight:900;font-size:44px;line-height:.95;text-align:center;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(90deg,var(--v),var(--r),var(--n));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #a855f799)}
.logo small{display:block;font-size:30px;color:var(--r);-webkit-text-fill-color:var(--r);text-shadow:0 0 18px var(--r)}
h2{margin:6px 0 0;font-size:15px;color:var(--n);text-transform:uppercase;letter-spacing:2px}
.btn{border:0;border-radius:16px;padding:15px 18px;font-size:17px;font-weight:800;color:#fff;background:var(--card);border:1px solid var(--line);transition:.2s;width:100%;text-align:left;font-family:inherit}
.btn:active{transform:scale(.97)}
.big{background:linear-gradient(135deg,var(--v),var(--r));text-align:center;font-size:24px;padding:20px;box-shadow:0 0 28px #ff2d5566;border:0;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 44px #a855f7aa}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{padding:12px;text-align:center;font-size:15px;border-radius:12px}
.chip.sel,.mode.sel{border-color:var(--n);box-shadow:0 0 14px #22f0ff66;background:#1c1040}
.mode small{display:block;color:var(--mu);font-weight:500;font-size:12px;margin-top:2px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0e0718;color:#fff;font-size:16px;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);gap:8px}
.pill{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;color:var(--tx);font-weight:700}
.disc{width:min(62vw,240px);aspect-ratio:1;border-radius:50%;margin:4px auto;background:conic-gradient(#111,#2a1650,#111,#4d0b1e,#111);border:3px solid var(--v);position:relative;box-shadow:0 0 36px #a855f788;display:flex;align-items:center;justify-content:center;overflow:hidden}
.disc img{width:100%;height:100%;object-fit:cover;display:none}
.disc .ic{font-size:56px}
.disc.spin{animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.disc.rev img{display:block}.disc.rev .ic{display:none}
.bar{height:7px;background:#20123a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--n))}
.q{text-align:center;font-weight:800;font-size:18px}
.ans{display:flex;flex-direction:column;gap:9px}
.ans .btn.ok{background:#0e3d25;border-color:var(--ok);box-shadow:0 0 18px #2dff8a66}
.ans .btn.ko{background:#4a0d1e;border-color:var(--r)}
.row{display:flex;gap:8px;align-items:center}
.sm{width:auto;padding:10px 14px;font-size:14px;text-align:center}
.rev-box{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:none}
.rev-box b{font-size:18px}
.res{display:flex;justify-content:space-between;padding:12px 14px;background:var(--card);border-radius:12px;border:1px solid var(--line);font-weight:700}
.res:first-child{border-color:#ffd24a;box-shadow:0 0 20px #ffd24a55}
.win{font-size:58px;text-align:center;animation:bo 1s infinite alternate}
@keyframes bo{to{transform:scale(1.18) rotate(6deg)}}
.msg{text-align:center;color:var(--mu);font-size:14px}
.err{color:var(--r)}
.conf{position:fixed;top:-30px;font-size:24px;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.spin2{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--n);border-radius:50%;animation:sp .8s linear infinite;margin:20px auto}
input[type=range]{width:90px;accent-color:var(--v)}
</style></head><body>

<section class="s on" id="home" style="justify-content:center">
<div class="logo">Blindtest<small>RAP FR</small></div>
<p class="msg">Devine le son. Extraits audio officiels (30 s) via Deezer.</p>
<button class="btn big" id="goSetup">▶ JOUER</button>
<div id="best" class="msg"></div>
</section>

<section class="s" id="setup">
<h2>Mode de jeu</h2>
<div id="modes" class="ans"></div>
<h2>Joueurs</h2>
<div class="grid" id="np" style="grid-template-columns:repeat(6,1fr)"></div>
<div id="names"></div>
<h2>Manches</h2>
<div class="grid" id="nr" style="grid-template-columns:repeat(5,1fr)"></div>
<label class="row msg"><input type="checkbox" id="cd"> Compte à rebours (20 s par question)</label>
<button class="btn big" id="start">LANCER LA PARTIE</button>
</section>

<section class="s" id="load" style="justify-content:center"><div class="spin2"></div><p class="msg" id="loadmsg">Chargement des extraits…</p><button class="btn sm" id="retry" style="display:none;margin:auto">Réessayer</button></section>

<section class="s" id="pass" style="justify-content:center;text-align:center">
<div class="msg">Passe le téléphone à</div><div class="logo" style="font-size:38px" id="passName"></div>
<button class="btn big" id="ready">PRÊT !</button></section>

<section class="s" id="play">
<div class="top"><span class="pill" id="who"></span><span class="pill" id="prog"></span><span class="pill" id="sc"></span></div>
<div class="top"><span id="tm" class="pill">⏱</span>
<span class="row"><button class="pill" id="mute" style="border:1px solid var(--line)">🔊</button><input type="range" id="vol" min="0" max="100" value="80"><button class="pill" id="fs" style="border:1px solid var(--line)">⛶</button></span></div>
<div class="disc" id="disc"><span class="ic">🎤</span><img id="cov" alt=""></div>
<div class="bar"><i id="pb"></i></div>
<div class="q" id="q"></div>
<div class="ans" id="ans"></div>
<div class="rev-box" id="rev"></div>
<div class="row"><button class="btn sm" id="replay">🔁 Réécouter</button><button class="btn sm big" id="next" style="display:none;flex:1;animation:none;font-size:17px;padding:12px">Suivant ➜</button></div>
<div class="msg err" id="pmsg"></div>
</section>

<section class="s" id="end">
<div class="win">🏆</div><div class="logo" style="font-size:30px" id="winner"></div>
<div id="rank" class="ans"></div><div class="msg" id="stats"></div>
<button class="btn big" id="again">🔁 Rejouer</button>
<button class="btn" id="nextgame" style="text-align:center">Partie suivante (nouveaux morceaux)</button>
<button class="btn" id="menu" style="text-align:center">Menu</button>
</section>

<script>
const ART=["Ninho","Jul","Gazo","PNL","SCH","Niska","Booba","SDM","Werenoi","Tiakola","PLK","Koba LaD","Damso","GIMS","Nekfeu","Orelsan","Soprano","Rohff","Kaaris","Lacrim","Zola","Hamza","Djadja & Dinaz","Gradur","Heuss L'Enfoiré","Leto","La Fouine","Freeze Corleone","Alonzo","Maes","Naps","Vald","Lomepal","Josman","Laylow","Dinos","Sofiane","Jok'air","Landy","Ziak","13 Block","Lefa","Fally Ipupa","Dadju","Bosh","Hatik","Bigflo & Oli","MHD","Youssoupha","IAM","Médine","Kery James","Ademo","Alpha Wann","Mac Tyer","Rim'K","Tory Lanez"].slice(0,52);
const MODES=[["classic","Classique","Devine le titre"],["artist","Artiste","Devine le rappeur"],["year","Année","Devine l'année de sortie"],["survie","Survie","Jusqu'à la 1re erreur"],["chrono","Chrono","Max de réponses en 60 s"],["hard","Blindtest difficile","Extraits de 6 s, morceaux moins connus"],["suite","Devine la suite","Extrait du milieu du morceau"]];
const $=s=>document.querySelector(s),D=document.createElement.bind(document);
let cfg={mode:"classic",np:1,nr:10,cd:false},S={},pool=[],played=new Set(),au=new Audio(),loading=false;
au.preload="auto";au.setAttribute("playsinline","");au.volume=.8;
const show=id=>document.querySelectorAll(".s").forEach(e=>e.classList.toggle("on",e.id===id));
const rnd=a=>a[Math.random()*a.length|0],shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const clean=t=>t.replace(/\s*[\(\[].*?[\)\]]/g,"").replace(/\s*-\s*(Single|EP|Remix).*$/i,"").trim();
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function bestTxt(){const b=store("brf")||{};const t=Object.keys(b).map(m=>MODES.find(x=>x[0]==m)[1]+" : "+b[m]).join(" · ");$("#best").textContent=t?"🏅 Meilleurs scores — "+t:""}
bestTxt();

// --- setup UI
MODES.forEach(m=>{const b=D("button");b.className="btn mode"+(m[0]==cfg.mode?" sel":"");b.innerHTML=m[1]+"<small>"+m[2]+"</small>";b.onclick=()=>{cfg.mode=m[0];document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("sel",x===b))};$("#modes").append(b)});
function chips(el,vals,key,cb){vals.forEach(v=>{const b=D("button");b.className="btn chip"+(v==cfg[key]?" sel":"");b.textContent=v;b.onclick=()=>{cfg[key]=v;[...el.children].forEach(x=>x.classList.toggle("sel",x===b));cb&&cb()};el.append(b)})}
function names(){const n=$("#names");const old=[...n.querySelectorAll("input")].map(i=>i.value);n.innerHTML="";if(cfg.np>1)for(let i=0;i<cfg.np;i++){const x=D("input");x.type="text";x.maxLength=14;x.placeholder="Joueur "+(i+1);x.value=old[i]||"";n.append(x)}}
chips($("#np"),[1,2,3,4,5,6],"np",names);chips($("#nr"),[5,10,15,20,30],"nr");
$("#goSetup").onclick=()=>show("setup");$("#menu").onclick=()=>show("home");$("#start").onclick=startGame;$("#again").onclick=startGame;
$("#nextgame").onclick=()=>startGame();$("#retry").onclick=startGame;

// --- audio controls
$("#vol").oninput=e=>{au.volume=e.target.value/100;au.muted=false;$("#mute").textContent=au.volume?"🔊":"🔇"};
$("#mute").onclick=()=>{au.muted=!au.muted;$("#mute").textContent=au.muted?"🔇":"🔊"};
$("#fs").onclick=()=>{try{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{$("#pmsg").textContent="Plein écran indisponible sur ce navigateur."})).call(d)}catch(e){}};
au.ontimeupdate=()=>{if(!S.t)return;const lim=S.lim;const p=(au.currentTime-S.st)/(lim||30)*100;$("#pb").style.width=Math.max(0,Math.min(100,p))+"%";if(lim&&au.currentTime>=S.st+lim)au.pause()};
au.onplaying=()=>{$("#disc").classList.add("spin");$("#pmsg").textContent=""};
au.onpause=au.onended=()=>$("#disc").classList.remove("spin");
au.onerror=()=>{if(S.t&&!S.done){S.errs=(S.errs||0)+1;if(S.errs>6){$("#pmsg").textContent="Extraits indisponibles (réseau ?).";return}$("#pmsg").textContent="Extrait indisponible, nouveau morceau…";S.t.bad=true;newQ()}};
function listen(){if(!S.t)return;try{au.currentTime=S.st||0}catch(e){}const p=au.play();p&&p.catch(()=>{$("#pmsg").textContent="Touche « Réécouter » pour lancer le son."})}
$("#replay").onclick=()=>{S.replays=(S.replays||0)+1;listen()};

// --- catalogue (iTunes Search API, sans clé)
function jsonp(u,ms){return new Promise((res,rej)=>{const cb="cb"+Math.random().toString(36).slice(2),sc=document.createElement("script");const end=()=>{clearTimeout(to);delete window[cb];sc.remove()};const to=setTimeout(()=>{end();rej(new Error("timeout"))},ms);window[cb]=d=>{end();res(d)};sc.onerror=()=>{end();rej(new Error("script"))};sc.src=u+"&callback="+cb;document.head.append(sc)})}
async function fetchArtist(a){
 const key=norm(a.split(" ")[0]),seen=new Set(pool.map(t=>t.id)),out=[];
 const add=t=>{if(!t.prev||!t.title||seen.has(t.id))return;const ti=clean(t.title);if(out.some(o=>norm(o.title)==norm(ti)))return;t.title=ti;t.hard=out.length>=10;out.push(t)};
 try{const j=await jsonp("https://api.deezer.com/search?q="+encodeURIComponent('artist:"'+a+'"')+"&limit=40&output=jsonp",9000);
  (j.data||[]).forEach(x=>{if(x.artist&&norm(x.artist.name).includes(key))add({id:"d"+x.id,did:x.id,title:x.title_short||x.title,artist:x.artist.name,year:0,prev:x.preview,cover:(x.album&&(x.album.cover_big||x.album.cover_medium))||""})})}catch(e){}
 if(out.length<5)try{const j=await jsonp("https://itunes.apple.com/search?term="+encodeURIComponent(a)+"&country=fr&media=music&entity=song&limit=40",9000);
  (j.results||[]).forEach(x=>{if(x.previewUrl&&x.trackName&&norm(x.artistName).includes(key))add({id:"i"+x.trackId,title:x.trackName,artist:x.artistName,year:+(x.releaseDate||"0").slice(0,4),prev:x.previewUrl,cover:(x.artworkUrl100||"").replace("100x100","400x400")})})}catch(e){}
 pool.push(...out);return out.length}
async function fill(n){if(loading)return;loading=true;const used=S.arts||(S.arts=new Set());const c=shuf(ART.filter(a=>!used.has(a))).slice(0,n);c.forEach(a=>used.add(a));await Promise.all(c.map(fetchArtist));loading=false}

// --- game
async function startGame(){
 cfg.np=+cfg.np;S={arts:new Set(),r:0,players:[],hist:[]};pool=[];
 const ins=[...document.querySelectorAll("#names input")];
 for(let i=0;i<cfg.np;i++)S.players.push({n:(ins[i]&&ins[i].value.trim())||"Joueur "+(i+1),s:0,ok:0,tot:0,ms:0});
 if(cfg.np==1)S.players[0].n="Toi";
 show("load");$("#retry").style.display="none";$("#loadmsg").textContent="Chargement des extraits…";
 await fill(9);
 if(pool.length<8){$("#loadmsg").innerHTML='<span class="err">Impossible de charger les extraits (réseau ou API Deezer/iTunes bloquée).</span>';$("#retry").style.display="block";return}
 if(cfg.mode=="chrono"){S.end=Date.now()+60000;S.iv=setInterval(()=>{const l=Math.max(0,Math.ceil((S.end-Date.now())/1000));$("#tm").textContent="⏱ "+l+" s";if(l<=0){clearInterval(S.iv);S.over=true;if(S.done||!S.t)finish();else{S.done=true;au.pause();finish()}}},250)}
 next();
}
function totalR(){return cfg.mode=="chrono"||cfg.mode=="survie"?"∞":cfg.nr}
function next(){
 if(S.over)return;
 if(!["chrono","survie"].includes(cfg.mode)&&S.r>=cfg.nr)return finish();
 if(cfg.np>1){$("#passName").textContent=S.players[S.r%cfg.np].n;show("pass");$("#ready").onclick=()=>{show("play");S.r++;newQ(true)};}
 else{show("play");S.r++;newQ(true)}
}
function newQ(first,force){
 clearInterval(S.cv);S.done=false;
 let c=pool.filter(t=>!played.has(t.id)&&!S.hist.includes(t.id)&&!t.bad&&(cfg.mode!="hard"||t.hard));
 if(!c.length)c=pool.filter(t=>!S.hist.includes(t.id)&&!t.bad);
 if(!c.length){S.hist=[];c=pool.filter(t=>!t.bad)}
 if(c.length<6||pool.filter(t=>!S.hist.includes(t.id)).length<8)fill(4);
 if(!c.length){$("#pmsg").textContent="Plus d'extraits disponibles.";return}
 const t=force||rnd(c),m=cfg.mode;
 if(m=="year"&&!t.year){$("#pmsg").textContent="Chargement…";const fin=y=>{if(y)t.year=y;else t.bad=true;newQ(first,y?t:null)};jsonp("https://api.deezer.com/track/"+t.did+"?output=jsonp",7000).then(d=>fin(+((d&&d.release_date)||"0").slice(0,4))).catch(()=>fin(0));return}
 S.t=t;S.hist.push(t.id);S.t0=Date.now();
 S.st=m=="suite"?14:0;S.lim=m=="hard"?6:m=="suite"?10:0;
 const pl=S.players[(S.r-1)%cfg.np];
 $("#who").textContent="🎮 "+pl.n;$("#prog").textContent="Manche "+S.r+"/"+totalR();$("#sc").textContent="⭐ "+pl.s;
 $("#rev").style.display="none";$("#next").style.display="none";$("#pmsg").textContent="";$("#pb").style.width="0";
 $("#disc").classList.remove("rev","spin");$("#cov").src="";
 $("#tm").style.visibility=(m=="chrono"||cfg.cd)?"visible":"hidden";
 $("#q").textContent={artist:"Qui est le rappeur ?",year:"En quelle année est sorti ce morceau ?",suite:"Quel est ce morceau ? (extrait du milieu)"}[m]||"Quel est le titre de ce morceau ?";
 let opts,good;
 if(m=="artist"){good=t.artist;opts=[...new Set(shuf(pool.filter(x=>x.artist!=t.artist).map(x=>x.artist)))].slice(0,3)}
 else if(m=="year"){good=String(t.year);const s=new Set();let g=0;while(s.size<3&&g++<60){const y=t.year+(Math.random()*9|0)-4;if(y!=t.year&&y>1995&&y<=new Date().getFullYear())s.add(y)}opts=[...s].map(String)}
 else{good=t.title;opts=[...new Set(shuf(pool.filter(x=>norm(x.title)!=norm(t.title)).map(x=>x.title)))].slice(0,3)}
 opts=shuf([good,...opts]);S.good=good;
 const a=$("#ans");a.innerHTML="";opts.forEach(o=>{const b=D("button");b.className="btn";b.textContent=o;b.onclick=()=>answer(o,b);a.append(b)});
 au.src=t.prev;au.load();
 au.addEventListener("loadedmetadata",()=>{if(S.st)try{au.currentTime=S.st}catch(e){}},{once:true});
 const p=au.play();p&&p.catch(()=>{$("#pmsg").textContent="Touche « Réécouter » pour lancer le son."});
 if(cfg.cd&&m!="chrono"){let l=20;$("#tm").textContent="⏱ "+l+" s";S.cv=setInterval(()=>{l--;$("#tm").textContent="⏱ "+l+" s";if(l<=0){clearInterval(S.cv);answer(null)}},1000)}
}
function answer(o,btn){
 if(S.done)return;S.done=true;clearInterval(S.cv);
 const pl=S.players[(S.r-1)%cfg.np],ok=o===S.good,t=S.t;
 pl.tot++;pl.ms+=Date.now()-S.t0;
 if(ok){pl.ok++;pl.s+=100+(cfg.cd?Math.max(0,20-(Date.now()-S.t0)/1000|0)*3:0)+(S.replays?0:20)}
 S.replays=0;S.errs=0;
 [...$("#ans").children].forEach(b=>{b.disabled=true;if(b.textContent===S.good)b.classList.add("ok");else if(b===btn)b.classList.add("ko")});
 $("#sc").textContent="⭐ "+pl.s;
 $("#cov").src=t.cover;$("#disc").classList.add("rev");
 const r=$("#rev");r.style.display="block";r.innerHTML=(o===null?"⏰ Temps écoulé !":ok?"✅ Bonne réponse !":"❌ Raté !")+"<br><b></b><br><span></span>";
 r.querySelector("b").textContent=t.title;r.querySelector("span").textContent=t.artist+" · "+t.year;
 if(S.lim){S.lim=0;S.st=0;au.currentTime=0;au.play().catch(()=>{})}
 const n=$("#next");
 if(cfg.mode=="survie"&&!ok){n.textContent="Voir le résultat";n.style.display="block";n.onclick=finish;return}
 if(cfg.mode=="chrono"){setTimeout(()=>{au.pause();next()},900);return}
 n.textContent=(cfg.mode!="survie"&&S.r>=cfg.nr)?"Résultats 🏁":"Suivant ➜";n.style.display="block";n.onclick=()=>{au.pause();next()};
}
function finish(){
 clearInterval(S.iv);clearInterval(S.cv);au.pause();S.t=null;S.hist.forEach(i=>played.add(i));
 const rk=[...S.players].sort((a,b)=>b.s-a.s);
 $("#winner").textContent=cfg.np>1?"Victoire : "+rk[0].n:"Score : "+rk[0].s;
 const el=$("#rank");el.innerHTML="";rk.forEach((p,i)=>{const d=D("div");d.className="res";d.textContent=(["🥇","🥈","🥉"][i]||(i+1)+".")+" "+p.n;const s=D("span");s.textContent=p.s+" pts";d.append(s);el.append(d)});
 const ok=S.players.reduce((a,p)=>a+p.ok,0),tot=S.players.reduce((a,p)=>a+p.tot,0),ms=S.players.reduce((a,p)=>a+p.ms,0);
 $("#stats").textContent="📊 "+ok+"/"+tot+" bonnes réponses"+(tot?" · "+Math.round(100*ok/tot)+" % · "+(ms/tot/1000).toFixed(1)+" s en moyenne":"");
 const b=store("brf")||{};if(rk[0].s>(b[cfg.mode]||0)){b[cfg.mode]=rk[0].s;store("brf",b);bestTxt()}
 show("end");for(let i=0;i<26;i++){const c=D("div");c.className="conf";c.textContent=rnd(["🎤","🔥","⭐","💜","🎵"]);c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*1.5+"s";document.body.append(c);setTimeout(()=>c.remove(),5000)}
}
</script></body></html>
